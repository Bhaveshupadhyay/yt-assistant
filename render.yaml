services:
  - type: web
    name: lenny-growth-assistant-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    branch: main
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["http://localhost:5173", "https://bhaveshupadhyay.github.io", "https://lennyai.clientmanger.tech"]'
      - key: CORS_ORIGIN_REGEX
        value: 'https?://.*(clientmanger\.tech|github\.io|vercel\.app|onrender\.com)'
